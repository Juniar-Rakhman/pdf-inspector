# ---------------------------------------------------------------------------
# PDF Signature Inspector - Quarkus configuration
# ---------------------------------------------------------------------------

quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Allow large PDF uploads
quarkus.http.limits.max-body-size=256M

# Temporary directory used by RESTEasy Reactive for multipart uploads
quarkus.http.body.uploads-directory=${java.io.tmpdir}/pdf-inspector-uploads

# CORS for the Vite dev server
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=content-type,accept,authorization

# Swagger UI / OpenAPI for developer inspection
quarkus.smallrye-openapi.store-schema-directory=/tmp/pdf-inspector-openapi

# Filesystem storage for uploaded documents and analysis results
app.storage.directory=${java.io.tmpdir}/pdf-signature-inspector

# Bouncy Castle as a JCE provider (registered at application startup)
app.crypto.provider=BC

quarkus.log.category."org.apache.pdfbox".level=WARN
quarkus.log.category."org.apache.commons.logging".level=WARN
quarkus.log.level=INFO
